<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо: капча + кнопка «Продолжить»</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 40px 20px;
      text-align: center;
      background: #f6f7f9;
      color: #141414;
      margin: 0;
    }
    h2 { font-weight: 600; }
    .wrap { max-width: 540px; margin: 0 auto; }
    iframe {
      border: 0;
      display: block;
      margin: 0 auto 20px;
      width: 100%;
      height: 260px;
      background: transparent;
    }
    button {
      font-size: 18px;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      background: #141414;
      color: #fff;
      cursor: pointer;
      transition: background .2s;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 12px; color: #666; font-size: 14px; min-height: 18px; }
    #log {
      margin-top: 20px;
      text-align: left;
      font: 12px/1.5 Consolas, monospace;
      background: #fff;
      border: 1px solid #e2e4e8;
      border-radius: 8px;
      padding: 10px 12px;
      color: #555;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Пройдите капчу, чтобы продолжить</h2>

    <iframe
      id="captcha-frame"
      src="https://doinwor.github.io/captcha/"
      width="500"
      height="260"
      title="Капча"
      sandbox="allow-scripts allow-same-origin allow-forms"
    ></iframe>

    <button id="continue-btn" disabled>Продолжить →</button>
    <div id="status">Ожидание прохождения капчи…</div>
    <div id="log">Ожидание сообщения от капчи…</div>
  </div>

  <script>
    var EXPECTED_ORIGIN = 'https://doinwor.github.io';
    var status = document.getElementById('status');
    var log = document.getElementById('log');
    var btn = document.getElementById('continue-btn');
    var frame = document.getElementById('captcha-frame');

    function line(t) { log.textContent += '\n' + t; }

    window.addEventListener('message', function (e) {
      line('message from origin: ' + e.origin + ' -> ' + JSON.stringify(e.data));
      // в проде обязательно проверяем origin; при локальном тесте (file://) origin будет 'null'
      if (e.origin !== EXPECTED_ORIGIN && e.origin !== 'null') return;
      if (e.data && e.data.type === 'captcha-resize' && e.data.height) {
        // капча обрезается ровно до плашки — подгоняем высоту iframe
        frame.style.height = Math.max(120, Math.min(500, e.data.height)) + 'px';
      }
      if (e.data && e.data.type === 'captcha-success') {
        btn.disabled = false;
        status.textContent = '✅ Капча пройдена — кнопка активна';
      }
    });

    // запрашиваем высоту у капчи, когда она загрузилась
    frame.addEventListener('load', function () {
      try { frame.contentWindow.postMessage({ type: 'captcha-height-request' }, EXPECTED_ORIGIN); } catch (err) {}
    });

    btn.addEventListener('click', function () {
      alert('Капча пройдена! Здесь ваш следующий шаг.');
    });
  </script>
</body>
</html>
