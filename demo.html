<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пример вставки капчи</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #141414;
      background: #fff;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    .card { width: 100%; max-width: 520px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p { color: #888; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
    p code { background: #f1f2f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    iframe {
      border: 0;
      display: block;
      width: 100%;
      height: 180px;
      background: transparent;
      margin-bottom: 18px;
    }
    button {
      font: inherit;
      font-size: 16px;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #141414;
      color: #fff;
      cursor: pointer;
      transition: background .2s;
    }
    button:disabled { background: #d7d7d7; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; color: #888; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Пример вставки капчи на сайт</h1>
    <p>
      Это обычная страница-пример. Капча ниже вставлена через <code>&lt;iframe&gt;</code> —
      она прозрачная, поэтому фон вокруг плашки — это фон самого сайта.
      Кнопка «Продолжить» активируется после прохождения капчи.
    </p>

    <iframe id="captcha-frame" src="https://doinwor.github.io/captcha/"
            width="500" height="180" title="Капча"
            sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <button id="continue-btn" disabled>Продолжить →</button>
    <div class="status" id="status">Пройдите капчу, чтобы активировать кнопку…</div>
  </div>

  <script>
    var EXPECTED_ORIGIN = 'https://doinwor.github.io';
    var frame = document.getElementById('captcha-frame');
    var btn = document.getElementById('continue-btn');
    var status = document.getElementById('status');

    window.addEventListener('message', function (e) {
      if (e.origin !== EXPECTED_ORIGIN && e.origin !== 'null') return;
      // капча сама сообщает свою высоту — подгоняем iframe
      if (e.data && e.data.type === 'captcha-resize' && e.data.height) {
        frame.style.height = Math.max(120, Math.min(500, e.data.height)) + 'px';
      }
      // капча пройдена
      if (e.data && e.data.type === 'captcha-success') {
        btn.disabled = false;
        status.textContent = 'Капча пройдена — кнопка активна.';
      }
    });

    // запрашиваем высоту у капчи, когда она загрузилась
    frame.addEventListener('load', function () {
      try { frame.contentWindow.postMessage({ type: 'captcha-height-request' }, EXPECTED_ORIGIN); } catch (err) {}
    });

    btn.addEventListener('click', function () {
      alert('Капча пройдена! Здесь ваш следующий шаг.');
    });
  </script>
</body>
</html>
